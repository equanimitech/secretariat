name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: secretariat-darwin-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: secretariat-darwin-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      # Mirror of the guard in tauri-release.yml. Refuse to ship a CLI
      # tarball whose embedded crate versions disagree with the tag.
      - name: Verify version consistency vs tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          CLI=$(grep -m1 '^version' crates/cli/Cargo.toml | cut -d'"' -f2)
          CORE=$(grep -m1 '^version' crates/core/Cargo.toml | cut -d'"' -f2)
          MCP=$(grep -m1 '^version' crates/mcp/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG cli=$CLI core=$CORE mcp=$MCP"
          for v in "$CLI" "$CORE" "$MCP"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::Version mismatch — manifests disagree with tag $TAG"
              exit 1
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build sec + sec-mcp
        run: cargo build --release --target ${{ matrix.target }} --bin sec --bin sec-mcp

      - name: Bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/secretariat
          cp "target/${TARGET}/release/sec" dist/secretariat/
          cp "target/${TARGET}/release/sec-mcp" dist/secretariat/
          [ -f scripts/install.sh ] && cp scripts/install.sh dist/secretariat/
          tar czf "${ARCHIVE}" -C dist secretariat

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
          generate_release_notes: true
