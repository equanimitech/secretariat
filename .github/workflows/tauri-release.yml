name: Release Tauri app (.dmg + updater bundle)

# Builds the Secretariat.app, packages a universal .dmg (Apple Silicon +
# Intel in one bundle), signs + notarizes when Apple secrets are
# configured, and uploads the updater manifest (latest.json) for the
# Tauri Updater plugin.
#
# Triggered alongside the existing CLI tarball workflow (release.yml).
# Both run on tag push; CLI tarball for power users, .dmg for principals.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Tag refs are quoted into env vars rather than splatted into `with:`
# expressions to keep the workflow safe from any future input-injection
# class issues.
env:
  TAG_REF: ${{ github.ref_name }}

jobs:
  build:
    name: Build Secretariat.app (universal macOS)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────────────────
      - name: Install Rust toolchain (both arches)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ── Caches ─────────────────────────────────────────────────────────────
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ hashFiles('**/Cargo.lock') }}

      # ── Build .app + .dmg + updater bundle ────────────────────────────────
      # tauri-action handles: vite build, cargo build (universal), bundle .app,
      # produce .dmg, sign with Developer ID (when env present), notarize
      # (when APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID present), generate the
      # updater bundle (.app.tar.gz + .sig) signed with TAURI_SIGNING_PRIVATE_KEY.
      - name: Build + sign + notarize
        uses: tauri-apps/tauri-action@v0
        env:
          # Tauri Updater signing (always present via repo secret, injected
          # into env so tauri build embeds the .sig alongside the .app.tar.gz)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Apple Developer ID — when these are present, tauri build signs
          # + notarizes. When absent, falls back to ad-hoc signing (Gatekeeper
          # warns once on first open). Both modes produce a usable .dmg.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Keychain password used by tauri-action when importing the cert.
          # Random per-run is fine; nothing else needs to read this keychain.
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ephemeral' }}
        with:
          # `tauri build` produces .dmg by default. --target universal-apple-darwin
          # bundles both architectures into one binary (lipo), which means one
          # .dmg works on Apple Silicon + Intel.
          args: --target universal-apple-darwin
          # Reuse the GitHub release the CLI workflow creates for this tag.
          # Both workflows append artifacts to the same release.
          tagName: ${{ env.TAG_REF }}
          releaseName: ${{ env.TAG_REF }}
          releaseBody: |
            See `Secretariat_*.dmg` for the full app (signed installer).
            See `secretariat-darwin-*.tar.gz` for the CLI-only tarball.
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
