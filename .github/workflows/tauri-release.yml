name: Release Tauri app

# Patterned after ../zenborg's release.yml — proven setup for Apple-Dev-ID
# signed + notarized .dmg with Tauri Updater bundle. Three-job structure:
# create draft release → build + sign + notarize → publish.
#
# Triggered on tag push (`v*`). Coexists with `release.yml` (CLI tarball).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.PACKAGE_VERSION}`,
              name: `Secretariat v${process.env.PACKAGE_VERSION}`,
              body: 'See CHANGELOG.md for details.',
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Hard gate. Catches the v0.9.0 incident class: bumped some
      # manifests, forgot tauri.conf.json → DMG + updater shipped under
      # the OLD version. Refuse the build if any manifest disagrees
      # with the pushed tag.
      - name: Verify version consistency vs tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CORE=$(grep -m1 '^version' crates/core/Cargo.toml | cut -d'"' -f2)
          CLI=$(grep -m1 '^version' crates/cli/Cargo.toml | cut -d'"' -f2)
          DAEMON=$(grep -m1 '^version' crates/daemon/Cargo.toml | cut -d'"' -f2)
          MCP=$(grep -m1 '^version' crates/mcp/Cargo.toml | cut -d'"' -f2)
          RELAY=$(grep -m1 '^version' crates/relay/Cargo.toml | cut -d'"' -f2)
          TAURI_CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG pkg=$PKG tauri.conf=$TAURI tauri.cargo=$TAURI_CARGO core=$CORE cli=$CLI daemon=$DAEMON mcp=$MCP relay=$RELAY"
          fail=0
          for v in "$PKG" "$TAURI" "$TAURI_CARGO" "$CORE" "$CLI" "$DAEMON" "$MCP" "$RELAY"; do
            if [ "$v" != "$TAG" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Version mismatch — at least one manifest disagrees with tag $TAG"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # Required by src-tauri/scripts/build-sidecars.sh to produce the
      # cognition-claude-sdk sidecar (Bun-compiled @anthropic-ai/claude-agent-sdk
      # wrapper) staged into src-tauri/binaries/.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: aarch64-apple-darwin
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: '--target aarch64-apple-darwin'

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: Publish release
        id: publish-release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
