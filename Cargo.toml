[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/cli", "crates/relay", "crates/mcp", "crates/daemon"]

# Shared dep versions across the workspace.
# Per-crate Cargo.toml files reference these via `.workspace = true`.
[workspace.dependencies]
secretariat-core = { path = "crates/core" }
secretariat-daemon = { path = "crates/daemon" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
base64 = "0.22"
dirs = "5.0"
hex = "0.4"
thiserror = "1.0"
bs58 = "0.5"
multibase = "0.9"
tempfile = "3"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
rmcp = { version = "0.8", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.0"

# dev only — pulled into individual crates' [dev-dependencies] by name
assert_cmd = "2"
predicates = "3"

# Optimize for smaller binary size in release builds (matches src-tauri's profile).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
