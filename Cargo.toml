[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/cli"]

# Shared dep versions across the workspace.
# Per-crate Cargo.toml files reference these via `.workspace = true`.
[workspace.dependencies]
secretariat-core = { path = "crates/core" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
base64 = "0.22"
dirs = "5.0"
hex = "0.4"
thiserror = "1.0"
bs58 = "0.5"
multibase = "0.9"

# dev only — pulled into individual crates' [dev-dependencies] by name
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Optimize for smaller binary size in release builds (matches src-tauri's profile).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
