[package]
name = "secretariat-relay"
version = "0.5.5"
edition = "2021"
authors = ["Rafa Ballestiero"]
license = "MIT"
description = "Self-hostable Secretariat relay: tokio + axum + per-tenant queue. Federation node, not a central server."

[[bin]]
name = "sec-relay"
path = "src/main.rs"

[dependencies]
secretariat-core = { path = "../core" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
reqwest.workspace = true
rand.workspace = true
