[package]
name = "secretariat-mcp"
version = "0.8.1"
edition = "2021"
authors = ["Rafa Ballestiero"]
license = "MIT"
description = "MCP server for Secretariat: stdio transport, exposes compose/list/verify/contact tools to Claude (and any MCP client). Stamp and send are deliberately not exposed."

[[bin]]
name = "sec-mcp"
path = "src/main.rs"

[dependencies]
secretariat-core = { path = "../core" }
secretariat-daemon = { path = "../daemon" }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
