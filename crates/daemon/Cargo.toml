[package]
name = "secretariat-daemon"
version = "0.16.3"
edition = "2021"
authors = ["Rafa Ballestiero"]
license = "MIT"
description = "Local supervision surface for Secretariat: macOS LaunchAgent install/uninstall/status plus a keepalive serve entry point. The federation/relay/sync column was removed in the git-native teardown; real subsystems re-land here when the git-native substrate grows its own delivery path."

[lib]
name = "secretariat_daemon"
path = "src/lib.rs"

[dependencies]
secretariat-core = { path = "../core" }
anyhow.workspace = true
ed25519-dalek.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
