[package]
name = "secretariat-daemon"
version = "0.4.4"
edition = "2021"
authors = ["Rafa Ballestiero"]
license = "MIT"
description = "Long-running local orchestrator for Secretariat: relay poll, outbox drain, LaunchAgent supervision. Evolves into the v0.3+ local nervous system (RelayServer, RelayClient, OutboxWatcher, InboxWriter, MetaResolver, AgentSupervisor, RoutingEngine, ScheduleTicker, IPC)."

[lib]
name = "secretariat_daemon"
path = "src/lib.rs"

[dependencies]
secretariat-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "8"

[dev-dependencies]
tempfile.workspace = true
