[package]
name = "secretariat-core"
version = "0.16.1"
edition = "2021"
authors = ["Rafa Ballestiero"]
license = "MIT"
description = "Core attestation primitives for Secretariat: keygen, hashing, frontmatter embed, did:web verification."

[lib]
name = "secretariat_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
chrono.workspace = true
base64.workspace = true
hex.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
multibase.workspace = true
dirs.workspace = true
tempfile.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = [
    "LAContext",
    "LAError",
    "block2",
] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials_UI",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
